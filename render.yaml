services:
  - type: web
    name: shimbadata
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/sd/_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNC_INTERVAL_MS
        value: "3600000"
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    autoDeploy: true