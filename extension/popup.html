<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShimbaData Collector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font-family: Roboto, Arial, sans-serif; font-size: 13px; color: #202124; background: #fff; }
    header { padding: 12px 14px; border-bottom: 1px solid #e4e4e4; display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 14px; font-weight: 500; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #34a853; }
    .tabs { display: flex; border-bottom: 1px solid #e4e4e4; }
    .tab { flex: 1; padding: 9px 4px; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; color: #5f6368; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 500; }
    main { padding: 12px 14px; }
    label { display: block; font-size: 11px; color: #5f6368; margin: 8px 0 2px; }
    input, select { width: 100%; padding: 7px 9px; border: 1px solid #dadce0; border-radius: 8px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #1a73e8; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .detect { width: 100%; margin-top: 10px; padding: 7px; border: 1px solid #dadce0; border-radius: 8px; background: #f8f9fa; cursor: pointer; font-size: 13px; }
    .detect:hover { border-color: #bdc1c6; }
    .candidates { margin-top: 6px; }
    .candidate { padding: 6px 8px; border: 1px solid #e4e4e4; border-radius: 6px; margin-bottom: 4px; cursor: pointer; font-size: 12px; }
    .candidate:hover { background: #f1f3f4; }
    .consent { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: #5f6368; line-height: 1.4; }
    .consent a { color: #1a0dab; }
    .submit { width: 100%; margin-top: 12px; padding: 9px; border: none; border-radius: 20px; background: #1a73e8; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .submit:disabled { background: #dadce0; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 12px; }
    .status.ok { color: #188038; }
    .status.err { color: #d93025; }
    .foot { padding: 10px 14px; border-top: 1px solid #e4e4e4; font-size: 11px; color: #70757a; text-align: center; }
    .foot a { color: #1a0dab; }
    .hidden { display: none; }
    #consentBox { margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>ShimbaData Collector</h1>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-dataset="schools">School</div>
    <div class="tab" data-dataset="papers">Paper</div>
    <div class="tab" data-dataset="health-facilities">Health</div>
    <div class="tab" data-dataset="laws">Law</div>
  </div>

  <main>
    <form id="form"></form>

    <button type="button" class="detect" id="detectBtn">Detect from this page (optional)</button>
    <div class="candidates" id="candidates"></div>

    <label for="email">Your email (so we can contact you about the submission)</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

    <div class="consent">
      <input type="checkbox" id="consentBox" />
      <label for="consentBox">
        I agree to submit this data under the
        <a href="https://shimbadata.onrender.com/terms" target="_blank" rel="noreferrer">Terms</a> and
        <a href="https://shimbadata.onrender.com/privacy" target="_blank" rel="noreferrer">Privacy Policy</a>.
        It will be reviewed before becoming public.
      </label>
    </div>

    <button class="submit" id="submitBtn" disabled>Submit for review</button>
    <div class="status" id="status"></div>
  </main>

  <div class="foot">
    Data goes to <a href="https://shimbadata.onrender.com" target="_blank" rel="noreferrer">ShimbaData</a> ·
    <a href="https://shimbadata.onrender.com/privacy" target="_blank" rel="noreferrer">Privacy</a> ·
    <a href="https://shimbadata.onrender.com/terms" target="_blank" rel="noreferrer">Terms</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
